# Render free web services sleep after 15 min idle, which would stall scheduled emails.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 https://outbox-scheduler-api-oj4g.onrender.com/health
